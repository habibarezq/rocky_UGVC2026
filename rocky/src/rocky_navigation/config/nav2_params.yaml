

# ---------------------------------------------------------------------------
#  Virtual Wall Node
# ---------------------------------------------------------------------------
lane_filter_node:
  ros__parameters:
    # show_debug:       True
    # ---------- Topics ----------
    image_topic:   /camera/image_raw
    camera_frame:  camera_link_optical

    # ---------- Camera intrinsics ----------
    # Row-major 3x3 matrix → 9 values
    K:
      - 793.79768697
      - 0.0
      - 290.78702859
      - 0.0
      - 813.96117996
      - 241.57106901
      - 0.0
      - 0.0
      - 1.0

    # Distortion coefficients [k1, k2, p1, p2, k3]
    dist_coeffs:
      - -4.97661814e-01
      -  8.05356640e+00
      -  9.44660547e-03
      - -2.64434172e-02
      - -4.33974203e+01

    # ---------- Camera extrinsics ----------
    camera_height:  1.33      # metres above ground
    pitch_deg:     -45.0      # negative = looking down
    yaw_deg:        -2.0
    roll_deg:       -7.0

    # ---------- Image size (pixels) ----------
    image_width:   640
    image_height:  480

    # ---------- Lane geometry ----------
    lane_half_width: 0.375    # half the lane width in metres

    # ---------- Circle detector limits ----------
    min_circle_radius: 10     # pixels
    max_circle_radius: 200    # pixels


lane_follower_node:
  ros__parameters:

    # ---------- Input cloud topics (must match lane_filter_node output) ----------
    left_cloud_topic:  /virtual_walls/left
    right_cloud_topic: /virtual_walls/right

    # ---------- Lookahead / slice geometry ----------
    lookahead_distance:  1.5    # metres — furthest depth slice checked
    lookahead_step:      0.5    # metres — spacing between depth slices
    slice_tolerance:     0.25   # metres — ±Z band for each depth slice

    # ---------- Navigation ----------
    min_remaining_dist: 0.7     # metres — re-send goal when this close to current
    startup_delay_sec:  0.0     # seconds — wait before first goal
    nav_goal_timeout:  30.0     # seconds — cancel goal if stalled this long
    abort_cooldown_sec: 2.0     # seconds — pause after genuine Nav2 failure

    # ---------- Lane / curve geometry ----------
    lane_width:          0.75   # metres
    curve_detect_thresh: 0.08   # lateral offset (m) that triggers curve mode
    curve_lookahead:     0.4    # metres — shortened lookahead on curves

    # ---------- Goal deduplication ----------
    goal_update_dist:    0.30   # metres — only update goal if it shifted this much
